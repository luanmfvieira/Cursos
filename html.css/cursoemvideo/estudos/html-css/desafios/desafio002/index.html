<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</p>
    <ul>
        <li><abbr title="Cabeçalho de nível 1">h1</abbr></li>
        <li><abbr title="Parágrafo">p</abbr></li>
        <li><abbr title="Imagem">img</abbr></li>
        <li><abbr title="Lista não ordenada">ul</abbr></li>
        <li><abbr title="Item de lista">li</abbr></li>
        <li><abbr title="Negrito">b</abbr></li>
        <li><abbr title="Link">a</abbr></li>
        <li><abbr title="Abreviação">abbr</abbr></li>
        <li><abbr title="Lista ordenada">ol</abbr></li>
        <li><abbr title="Citação">blockquote</abbr></li>
        <li><abbr title="Código-fonte">code</abbr></li>
    </ul>
</body>
</html>
