<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes externas</title>
    <style>
        @font-face {
            font-family: 'goth';
            src: url(Black\ Witcher.otf) format('opentype');
            font-weight: normal;
            font-style: normal;

            /*
            Tipos de format()
             opentype (otf)
             truetype (ttf)
             embedded-opentype (eot)
             truetype-aat (Apple advanced Typography)
             svg (Scalable Vector Graphics)
            */
        }
        body {
            font-family: 'Courier New', Courier, monospace;
        }
        h1 {
            font-family: 'goth';
            font-size: 3em;
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h1>Loroan</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Nostrum maxime obcaecati aut quis quos, consectetur distinctio similique accusantium itaque consequatur sapiente necessitatibus eveniet cumque corrupti iure dicta est repellat quia.</p>
    
</body>
</html>
