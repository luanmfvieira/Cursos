<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = children
        */
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a {
            color: blue;
        }
        a:visited {
            color: purple;
        }
        a:hover {
            font-weight: bold;
        }
        a:active {
            color: black;
        }
        .especial {
            background-color: rgb(172, 171, 171);
        }
        .especial::before {
            content: " ✝︎ ";
            color: red;
        }
        .especial::after {
            content: " ✝︎ ";
            color: red;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/luanmfv" target="_blank" class="especial">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/watch?v=vMlrcOVr7po&list=PLHz_AreHm4dlUpEXkY1AyVLQGcpSgVF8s&index=22" target="_blank">Canal do YouTube</a></li>
        <li><a href="https://chatgpt.com/" target="_blank" class="especial">Site do Chatgpt</a></li>
    </ul>
</body>
</html>
